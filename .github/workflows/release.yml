name: Release

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build'
        required: true
        type: choice
        default: 'all'
        options:
          - mac
          - win
          - linux
          - all
      version:
        description: 'Version tag (e.g. v1.1.19)'
        required: true
        type: string
        default: ''

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each mac arch builds on its own native runner. Do NOT collapse these
          # into one job: npmRebuild is false, so a single runner would pack its
          # own arch's better_sqlite3.node (and Chrome) into both bundles.
          - os: macos-latest
            platform: mac
            arch: arm64
            archFlag: '--arm64'
          - os: macos-15-intel
            platform: mac
            arch: x64
            archFlag: '--x64'
          - os: ubuntu-latest
            platform: linux
            arch: x64
            archFlag: ''
          - os: windows-latest
            platform: win
            arch: x64
            archFlag: ''
    runs-on: ${{ matrix.os }}

    steps:
      - name: Skip non-selected platforms
        if: ${{ github.event.inputs.platforms != 'all' && github.event.inputs.platforms != matrix.platform }}
        run: exit 0

      - uses: actions/checkout@v7
        if: ${{ github.event.inputs.platforms == 'all' || github.event.inputs.platforms == matrix.platform }}

      - uses: actions/setup-node@v6
        if: ${{ github.event.inputs.platforms == 'all' || github.event.inputs.platforms == matrix.platform }}
        with:
          node-version: '22'

      - name: Bump version in package.json
        if: ${{ github.event.inputs.platforms == 'all' || github.event.inputs.platforms == matrix.platform }}
        run: node -e "const p=require('./package.json');p.version='${{ github.event.inputs.version }}'.replace(/^v/,'');require('fs').writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Install
        if: ${{ github.event.inputs.platforms == 'all' || github.event.inputs.platforms == matrix.platform }}
        run: npm ci --ignore-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Install setuptools (for node-gyp on Python 3.12+)
        if: ${{ github.event.inputs.platforms == 'all' || github.event.inputs.platforms == matrix.platform }}
        run: pip3 install --break-system-packages setuptools

      - name: Rebuild native modules for Electron
        if: ${{ github.event.inputs.platforms == 'all' || github.event.inputs.platforms == matrix.platform }}
        run: npm run rebuild:electron

      - name: Bundle Chrome for Testing
        if: ${{ github.event.inputs.platforms == 'all' || github.event.inputs.platforms == matrix.platform }}
        run: node scripts/bundle-chrome.mjs

      - name: Test
        if: ${{ github.event.inputs.platforms == 'all' || github.event.inputs.platforms == matrix.platform }}
        run: npm test
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Verify native module arch
        if: ${{ runner.os == 'macOS' && (github.event.inputs.platforms == 'all' || github.event.inputs.platforms == matrix.platform) }}
        run: |
          set -euo pipefail
          EXPECT=$([ "${{ matrix.arch }}" = "arm64" ] && echo arm64 || echo x86_64)
          INFO=$(file -b node_modules/better-sqlite3/build/Release/better_sqlite3.node)
          echo "better_sqlite3.node: $INFO (expecting $EXPECT)"
          case "$INFO" in
            *"$EXPECT"*) echo "OK" ;;
            *) echo "::error::better_sqlite3.node is not $EXPECT — refusing to package a cross-arch build"; exit 1 ;;
          esac

      - name: Build
        if: ${{ github.event.inputs.platforms == 'all' || github.event.inputs.platforms == matrix.platform }}
        run: npm run dist:${{ matrix.platform }} -- ${{ matrix.archFlag }}
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The invariant that actually matters: everything inside the shipped .app
      # is the target arch. v1.5.0's x64 dmg carried an arm64 better_sqlite3.node
      # and an arm64 Chromium, and nothing caught it before release.
      - name: Verify packaged app arch
        if: ${{ runner.os == 'macOS' && (github.event.inputs.platforms == 'all' || github.event.inputs.platforms == matrix.platform) }}
        run: |
          set -uo pipefail
          EXPECT=$([ "${{ matrix.arch }}" = "arm64" ] && echo arm64 || echo x86_64)
          APP=$(find release -maxdepth 2 -name 'Homelander.app' -print -quit)
          if [ -z "$APP" ]; then echo "::error::no packaged .app found under release/"; exit 1; fi
          echo "Checking $APP (expecting $EXPECT)"
          FAIL=0
          check() {
            if [ -z "$2" ] || [ ! -e "$2" ]; then
              echo "::error::$1 missing (looked for: ${2:-<not found>})"; FAIL=1; return
            fi
            INFO=$(file -b "$2")
            echo "  $1: $INFO"
            case "$INFO" in
              *"$EXPECT"*) ;;
              *) echo "::error::$1 is not $EXPECT"; FAIL=1 ;;
            esac
          }
          check "electron binary" "$APP/Contents/MacOS/Homelander"
          check "better_sqlite3.node" "$APP/Contents/Resources/app.asar.unpacked/node_modules/better-sqlite3/build/Release/better_sqlite3.node"
          check "bundled Chrome" "$(find "$APP/Contents/Resources/chrome-bin" -type f -name 'Google Chrome for Testing' -print -quit 2>/dev/null)"
          exit $FAIL

      - name: Upload to release
        if: ${{ github.event.inputs.platforms == 'all' || github.event.inputs.platforms == matrix.platform }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version }}
          files: |
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
            release/*.zip.blockmap
            release/*.exe
            release/*.exe.blockmap
            release/*.AppImage
            release/*.deb
            release/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
