name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.5)'
        required: true
        type: string
        default: 'v1.0.5'

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install
        run: npm ci --ignore-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Install setuptools (for node-gyp on Python 3.12+)
        run: pip3 install --break-system-packages setuptools

      - name: Rebuild native modules for Electron
        run: npm run rebuild:electron

      - name: Test
        run: npm test
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Verify native module arch
        run: file node_modules/better-sqlite3/build/Release/better_sqlite3.node

      - name: Build
        run: npm run dist:${{ matrix.platform }}
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version }}
          files: |
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
            release/*.zip.blockmap
            release/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
